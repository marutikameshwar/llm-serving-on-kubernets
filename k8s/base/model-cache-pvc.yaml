apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: llm-serving
  labels:
    app.kubernetes.io/name: model-cache
    app.kubernetes.io/part-of: llm-serving-k8s
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
