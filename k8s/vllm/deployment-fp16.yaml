apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fp16
  namespace: llm-serving
  labels:
    app.kubernetes.io/name: vllm-fp16
    app.kubernetes.io/part-of: llm-serving-k8s
    model: qwen2.5-7b
    precision: fp16
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-serving
  template:
    metadata:
      labels:
        app: vllm-serving
        precision: fp16
    spec:
      containers:
      - name: vllm-openai
        image: vllm/vllm-openai:v0.6.3.post1
        args:
        - "--model"
        - "Qwen/Qwen2.5-7B-Instruct"
        - "--served-model-name"
        - "qwen2.5-7b"
        - "--port"
        - "8000"
        - "--gpu-memory-utilization"
        - "0.90"
        - "--max-model-len"
        - "4096"
        - "--trust-remote-code"
        env:
        - name: HF_HOME
          value: "/root/.cache/huggingface"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
        - name: VLLM_USAGE_SOURCE
          value: "production-k8s"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: 16Gi
          requests:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: 8Gi
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface
        - name: dshm
          mountPath: /dev/shm
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
